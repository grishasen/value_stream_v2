catalog_version: 2
processors:
- id: ih_engagement
  source: ih
  kind: binary_outcome
  description: Engagement outcomes for Pega interaction history, with customer, channel, offer, and experiment
    dimensions.
  time:
    property: OutcomeTime
    grain: daily
    calendar:
      timezone: UTC
      week_start: monday
      fiscal_year_start_month: 1
  entities:
    subject: SubjectID
  outcome:
    column: Outcome
    positive_values:
    - Clicked
    - Conversion
    negative_values:
    - Impression
    - Pending
  states:
    Count:
      type: count
    Positives:
      type: count
      outcome: positive
    Negatives:
      type: count
      outcome: negative
    UniqueCustomers_cpc:
      type: cpc
      source_column: SubjectID
      lg_k: 11
    UniqueInteractions_cpc:
      type: cpc
      source_column: InteractionID
      lg_k: 11
  group_by:
  - Day
  - Week
  - Month
  - Quarter
  - Year
  - Channel
  - Direction
  - CustomerSegment
  - IsProspect
  - Issue
  - Group
  - Name
  - Treatment
  - PlacementType
  - ModelControlGroup
  - MktType
  - MktValue
  - PropensitySource
  - ModelClass
- id: ih_response_time
  source: ih
  kind: numeric_distribution
  description: Response time distribution from decision to outcome by customer, channel, and offer context.
  time:
    property: OutcomeTime
    grain: daily
    calendar:
      timezone: UTC
      week_start: monday
      fiscal_year_start_month: 1
  properties:
  - ResponseTime
  quantile_engine: tdigest
  group_by:
  - Day
  - Week
  - Month
  - Quarter
  - Year
  - Channel
  - Direction
  - CustomerSegment
  - IsProspect
  - Issue
  - Group
  - Name
  - Outcome
  states:
    ResponseTime_Count:
      type: count
      source_column: ResponseTime
    ResponseTime_Sum:
      type: value_sum
      source_column: ResponseTime
    ResponseTime_Mean:
      type: pooled_mean
      source_column: ResponseTime
      weight: ResponseTime_Count
    ResponseTime_Var:
      type: pooled_variance
      source_column: ResponseTime
      mean: ResponseTime_Mean
      weight: ResponseTime_Count
    ResponseTime_Min:
      type: min
      source_column: ResponseTime
    ResponseTime_Max:
      type: max
      source_column: ResponseTime
    ResponseTime_tdigest:
      type: tdigest
      source_column: ResponseTime
      k: 500
- entity: SubjectID
  id: ih_outcome_funnel
  source: ih
  kind: funnel
  description: Outcome progression from impressions to clicks to conversions.
  time:
    property: OutcomeTime
    grain: daily
    calendar:
      timezone: UTC
      week_start: monday
      fiscal_year_start_month: 1
  stages:
  - name: Impression
    when:
      op: eq
      column: Outcome
      value: Impression
  - name: Clicked
    when:
      op: eq
      column: Outcome
      value: Clicked
  - name: Conversion
    when:
      op: eq
      column: Outcome
      value: Conversion
  states:
    Impression_Count:
      type: count
      stage: Impression
    Clicked_Count:
      type: count
      stage: Clicked
    Conversion_Count:
      type: count
      stage: Conversion
  group_by:
  - Day
  - Week
  - Month
  - Quarter
  - Year
  - Channel
  - Direction
  - CustomerSegment
  - IsProspect
  - Issue
  - Group
  - Name
  - ModelControlGroup
  - PlacementType
- id: ih_propensity_scores
  source: ih
  kind: score_distribution
  description: Distribution of propensity, final propensity, priority, and rank across engagement dimensions.
  time:
    property: OutcomeTime
    grain: daily
    calendar:
      timezone: UTC
      week_start: monday
      fiscal_year_start_month: 1
  states:
    FinalPropensity_tdigest:
      type: tdigest
      source_column: FinalPropensity
    Propensity_tdigest:
      type: tdigest
      source_column: Propensity
    Priority_tdigest:
      type: tdigest
      source_column: Priority
    Count:
      type: count
    personalization:
      type: pooled_mean
      weight: Count
      recipe: personalization
    Propensity_tdigest_positives:
      type: tdigest
      source_column: Propensity
      score_property: Propensity
      outcome: positive
    Propensity_tdigest_negatives:
      type: tdigest
      source_column: Propensity
      score_property: Propensity
      outcome: negative
    FinalPropensity_tdigest_positives:
      type: tdigest
      source_column: FinalPropensity
      score_property: FinalPropensity
      outcome: positive
    FinalPropensity_tdigest_negatives:
      type: tdigest
      source_column: FinalPropensity
      score_property: FinalPropensity
      outcome: negative
    UniqueCustomers_cpc:
      type: cpc
      lg_k: 11
      source_column: CustomerID
    novelty:
      type: pooled_mean
      weight: Count
      recipe: novelty
  score_properties:
  - column: Propensity
    role: primary
  - column: FinalPropensity
    role: calibrated
  - column: Priority
    role: auxiliary
  outcome:
    column: Outcome
    positive_values:
    - Clicked
    negative_values:
    - Impression
    - Pending
  group_by:
  - Day
  - Week
  - Month
  - Quarter
  - Year
  - Channel
  - Direction
  - CustomerSegment
  - IsProspect
  - Issue
  - Group
  - Name
  - ModelControlGroup
  - PropensitySource
  - PlacementType
