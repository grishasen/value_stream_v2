version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: "%(ansi_timestamp)s%(asctime)s.%(msecs)03d%(ansi_reset)s:%(ansi_level)s%(levelname)s%(ansi_reset)s:%(ansi_logger)s%(name_last)s%(ansi_reset)s:%(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: valuestream.utils.logger.ThemeColorStreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stderr

root:
  level: INFO
  handlers: [ console ]

loggers:
  valuestream:
    level: DEBUG
    handlers: [ console ]
    propagate: false
