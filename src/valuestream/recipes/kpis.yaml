      revenue.
    business_questions:
    - Revenue generated by recorded conversion outcomes.
    tags:
    - marketing costs and revenue
    - finance
    - revenue
    maturity: reviewed
    processor_kinds:
    - binary_outcome
    inputs:
    - role: revenue
      label: Revenue from conversion outcomes
      source: state
      state_types:
      - value_sum
      selection: automatic
      state_template:
        type: value_sum
        source_column: Revenue
        where:
          op: eq
          column: Outcome
          value: Conversion
      proposed_name: ConversionRevenue
    default_metric_id: VS_Revenue
    metric:
      processor: ${processor_id}
      kind: formula
      expression:
        col: ${revenue}
      description: Revenue generated by recorded conversion outcomes.
      display:
        label: Conversion revenue
        unit: currency
        value_format: currency
        direction: higher_is_better
    method:
      calculation: sum(Revenue where Outcome = Conversion)
      accuracy: exact
      algorithm: Calculation over persisted mergeable aggregates.
      caveat: Sum Revenue only on Conversion outcomes after processor deduplication. Use a conversion processor whose
        positive outcome is Conversion and keep the currency and eligible population consistent. FAT retains a 3.5
        demonstration fallback only where Revenue is absent; replace it with real business values for financial use.
    report:
      chart: kpi_card
      placement: kpi_strip
