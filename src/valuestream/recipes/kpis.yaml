    default_metric_id: VS_ChiSquareTest
    metric:
      processor: ${processor_id}
      kind: contingency_test
      variant_column: ${variant}
      tests:
      - chi2
      - g
      outputs:
      - Count
      - Positives
      - Negatives
      - chi2_stat
      - chi2_dof
      - chi2_p_val
      - g_stat
      - g_p_val
      description: Assess whether response rates differ across all recorded experiment variants.
      display:
        label: Chi-square test across experiment variants
        unit: probability
        value_format: number
        direction: neutral
    method:
      calculation: chi-square and likelihood-ratio G tests over the variant/outcome contingency table
      accuracy: statistical
      algorithm: Existing aggregate statistical or sketch implementation.
      caveat: Includes all variants, including NBA when grouping by ModelControlGroup. Use one experiment and adequate
        expected cell counts. A significant result indicates some rates differ; it does not identify a winning variant
        or prove a causal effect.
    report:
      chart: table
      placement: content
    required_states:
      Positives: count
      Negatives: count
