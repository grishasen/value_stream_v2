schema_version: 1
recipes:
  - id: engagement.engagement_rate
    version: 1
    title: Engagement rate
    domain: Engagement
    summary: Share of classified outcomes that are positive.
    business_questions:
      - Are interactions producing a positive customer response?
      - Which aggregate segments have the strongest engagement?
    tags: [ engagement, outcome, rate ]
    maturity: certified
    processor_kinds: [ binary_outcome ]
    inputs:
      - role: positives
        label: Positive outcome count
        source: state
        state_types: [ count ]
        preferred_names: [ Positives ]
        selection: automatic
        require_preferred: true
      - role: negatives
        label: Negative outcome count
        source: state
        state_types: [ count ]
        preferred_names: [ Negatives ]
        selection: automatic
        require_preferred: true
    default_metric_id: VS_Engagement_Rate
    metric:
      processor: ${processor_id}
      kind: formula
      description: Positive outcomes divided by positive plus negative outcomes.
      display:
        label: Engagement rate
        unit: percent
        value_format: percent
        direction: higher_is_better
      expression:
        op: safe_div
        num: { col: "${positives}" }
        den:
          op: add
          args:
            - { col: "${positives}" }
            - { col: "${negatives}" }
    method:
      calculation: positives / (positives + negatives)
      accuracy: exact
      algorithm: Safe division over mergeable count states.
      caveat: The processor's positive and negative value classifications define the denominator.
    report:
      chart: kpi_card
      placement: kpi_strip
      kpi: { comparison: previous_period, comparison_period: month }

  - id: engagement.positive_outcomes
    version: 1
    title: Positive outcomes
    domain: Engagement
    summary: Number of outcomes classified as positive by the source processor.
    business_questions:
      - How many positive responses did the business generate?
    tags: [ engagement, outcome, volume ]
    maturity: certified
    processor_kinds: [ binary_outcome ]
    inputs:
      - role: positives
        label: Positive outcome count
        source: state
        state_types: [ count ]
        preferred_names: [ Positives ]
        selection: automatic
        require_preferred: true
    default_metric_id: VS_Positive_Outcomes
    metric:
      processor: ${processor_id}
      kind: formula
      description: Count of outcomes classified as positive.
      display:
        label: Positive outcomes
        unit: outcomes
        value_format: integer
        direction: higher_is_better
      expression: { col: "${positives}" }
    method:
      calculation: positives
      accuracy: exact
      algorithm: Mergeable count state.
      caveat: Classification semantics are owned by the selected processor.
    report: { chart: kpi_card, placement: kpi_strip }

  - id: audience.unique_entities
    version: 1
    title: Unique entities
    domain: Audience
    summary: Approximate distinct entities observed by an aggregate processor.
    business_questions:
      - How many distinct customers or entities were reached?
      - What is the de-duplicated audience size for this period?
    tags: [ audience, reach, distinct, cpc, hll, theta, sketch ]
    maturity: certified
    processor_kinds:
      [ binary_outcome, numeric_distribution, score_distribution, entity_lifecycle, entity_set, funnel, snapshot ]
    inputs:
      - role: cardinality_state
        label: Entity field
        description: Select any processor-owned field; CPC is preferred, while HLL and Theta remain available.
        source: state
        state_types: [ cpc, hll, theta ]
        preferred_names: [ UniqueCustomers_cpc, UniqueSubjects_cpc, UniqueEntities_cpc ]
        preferred_state_types: [ cpc ]
        selection: field_algorithm
    default_metric_id: VS_Unique_Entities
    metric:
      processor: ${processor_id}
      kind: approx_distinct_count
      description: Approximate distinct entity count from a persisted mergeable sketch.
      display:
        label: Unique entities
        unit: entities
        value_format: integer
        direction: higher_is_better
      state: ${cardinality_state}
    method:
      calculation: estimated distinct count of the selected entity sketch
      accuracy: approximate
      algorithm: CPC by default; HLL and Theta are available alternatives.
      caveat: Precision depends on the sketch parameter and estimates include bounded sampling error. Theta is most useful when the same state also participates in set algebra.
    report: { chart: kpi_card, placement: kpi_strip }

  - id: distribution.median
    version: 1
    title: Median value
    domain: Distribution
    summary: Median of a persisted numeric or score distribution.
    business_questions:
      - What is the typical value without sensitivity to extreme observations?
    tags: [ distribution, median, quantile, tdigest, kll ]
    maturity: reviewed
    processor_kinds: [ numeric_distribution, score_distribution ]
    inputs:
      - role: digest_state
        label: Value field
        source: state
        state_types: [ tdigest, kll ]
        absent_state_attributes: [ outcome ]
        selection: field_algorithm
    default_metric_id: VS_Median_Value
    metric:
      processor: ${processor_id}
      kind: quantile
      description: Median reconstructed from a persisted mergeable distribution sketch.
      display:
        label: Median value
        unit: value
        value_format: number
        direction: neutral
      state: ${digest_state}
      quantile: 0.5
    method:
      calculation: q(0.50)
      accuracy: approximate
      algorithm: Quantile query over a t-digest or KLL state.
      caveat: Approximation error depends on sketch configuration and the observed distribution.
    report: { chart: kpi_card, placement: kpi_strip }

  - id: distribution.p95
    version: 1
    title: 95th percentile
    domain: Distribution
    summary: High-tail value exceeded by approximately five percent of observations.
    business_questions:
      - What does a high but non-maximum response time or score look like?
      - Are tail outcomes improving?
    tags: [ distribution, p95, tail, service, tdigest, kll ]
    maturity: reviewed
    processor_kinds: [ numeric_distribution, score_distribution ]
    inputs:
      - role: digest_state
        label: Value field
        source: state
        state_types: [ tdigest, kll ]
        absent_state_attributes: [ outcome ]
        selection: field_algorithm
    default_metric_id: VS_P95_Value
    metric:
      processor: ${processor_id}
      kind: quantile
      description: 95th percentile reconstructed from a persisted mergeable distribution sketch.
      display:
        label: 95th percentile
        unit: value
        value_format: number
        direction: lower_is_better
      state: ${digest_state}
      quantile: 0.95
    method:
      calculation: q(0.95)
      accuracy: approximate
      algorithm: Quantile query over a t-digest or KLL state.
      caveat: Confirm whether higher or lower is favorable for the selected business value.
    report: { chart: kpi_card, placement: kpi_strip }

  - id: distribution.boxplot
    version: 1
    title: Distribution boxplot
    domain: Distribution
    summary: Median, quartiles, and tails of a persisted numeric distribution as a boxplot.
    business_questions:
      - How is the value distributed beyond a single summary number?
      - Do the median and tails shift across segments or time?
    tags: [ distribution, boxplot, quartiles, spread, tdigest, kll ]
    maturity: reviewed
    processor_kinds: [ numeric_distribution, score_distribution ]
    inputs:
      - role: digest_state
        label: Value field
        source: state
        state_types: [ tdigest, kll ]
        absent_state_attributes: [ outcome ]
        selection: field_algorithm
    default_metric_id: VS_Distribution
    metric:
      processor: ${processor_id}
      kind: distribution
      description: Distribution metric exposing the median and the full quantile suite from a persisted mergeable sketch.
      display:
        label: Distribution
        unit: value
        value_format: number
        direction: neutral
      state: ${digest_state}
    method:
      calculation: quantile suite (min, p05-p95, max)
      accuracy: approximate
      algorithm: Quantile-suite queries over a t-digest or KLL state rendered as a boxplot.
      caveat: Approximation error depends on sketch configuration and the observed distribution.
    report: { chart: boxplot, placement: content }

  - id: service.response_time_p95
    version: 1
    title: Response time (P95)
    domain: Service health
    summary: High-tail seconds between decision and recorded outcome, exceeded by five percent of interactions.
    business_questions:
      - How quickly do customers act on delivered decisions?
      - Are slow response tails improving after channel or arbitration changes?
    tags: [ service, latency, response-time, p95, tail, tdigest, kll ]
    maturity: reviewed
    processor_kinds: [ numeric_distribution, score_distribution ]
    inputs:
      - role: digest_state
        label: Response-time field
        description: Persisted distribution sketch over a duration column such as decision-to-outcome seconds.
        source: state
        state_types: [ tdigest, kll ]
        absent_state_attributes: [ outcome ]
        preferred_names: [ ResponseTime_tdigest, ResponseTime_kll, Latency_tdigest, Duration_tdigest ]
        selection: field_algorithm
    default_metric_id: VS_Response_Time_P95
    metric:
      processor: ${processor_id}
      kind: quantile
      description: 95th-percentile response time reconstructed from a persisted mergeable distribution sketch.
      display:
        label: P95 response time
        unit: seconds
        value_format: number
        direction: lower_is_better
      state: ${digest_state}
      quantile: 0.95
    method:
      calculation: q(0.95) of the persisted response-time distribution
      accuracy: approximate
      algorithm: Quantile query over a t-digest or KLL state.
      caveat: Measures the latency recorded in the source column (for example decision-to-outcome), not system serving latency; approximation error depends on sketch configuration.
    report:
      chart: kpi_card
      placement: kpi_strip
      kpi: { comparison: previous_period, comparison_period: month, sparkline_grain: daily, sparkline_points: 30 }

  - id: model_quality.roc_auc
    version: 1
    title: ROC AUC
    domain: Model quality
    summary: Ranking discrimination reconstructed from positive and negative score distributions.
    business_questions:
      - How well does the score rank positive outcomes above negative outcomes?
    tags: [ model, quality, roc, auc, digest ]
    maturity: reviewed
    processor_kinds: [ score_distribution ]
    inputs:
      - role: positive_digest
        label: Score field
        source: state
        state_types: [ tdigest ]
        state_attributes: { outcome: positive }
        preferred_state_types: [ tdigest ]
        selection: field_algorithm
      - role: negative_digest
        label: Matched negative-outcome digest
        source: state
        state_types: [ tdigest ]
        state_attributes: { outcome: negative }
        selection: automatic
        same_attribute_as: positive_digest
        match_attribute: score_property
    default_metric_id: VS_ROC_AUC
    metric:
      processor: ${processor_id}
      kind: curve_from_digests
      description: Approximate ROC AUC reconstructed from positive and negative score digests.
      display:
        label: ROC AUC
        unit: score
        value_format: number
        direction: higher_is_better
      positive_state: ${positive_digest}
      negative_state: ${negative_digest}
      output: roc_auc
    method:
      calculation: area under the reconstructed receiver operating characteristic curve
      accuracy: approximate
      algorithm: Curve reconstruction from mergeable positive and negative t-digests.
      caveat: It is a distribution-sketch approximation, not an exact row-level rank calculation.
    report: { chart: kpi_card, placement: kpi_strip }

  - id: model_quality.score_calibration
    version: 1
    title: Score calibration ratio
    domain: Model quality
    summary: Observed positive rate divided by the average score the model promised.
    business_questions:
      - Does the model deliver the response rate it predicts, or does it over-promise?
      - Which segments is the score honest in, and where does it drift?
    tags: [ model, quality, calibration, propensity, score, reliability ]
    maturity: reviewed
    processor_kinds: [ binary_outcome ]
    inputs:
      - role: positives
        label: Positive outcome count
        source: state
        state_types: [ count ]
        preferred_names: [ Positives ]
        selection: automatic
        require_preferred: true
      - role: score_sum
        label: Predicted-score total
        description: A value_sum over the score the model assigned to each decision, so its mean can be compared with what actually happened.
        source: state
        state_types: [ value_sum ]
        preferred_names: [ PropensitySum, ScoreSum ]
        selection: field_algorithm
      - role: observations
        label: Scored decision count
        source: state
        state_types: [ count ]
        preferred_names: [ Count ]
        selection: automatic
        require_preferred: true
        different_from: positives
    default_metric_id: VS_Score_Calibration
    metric:
      processor: ${processor_id}
      kind: formula
      description: Observed positive rate divided by the mean predicted score.
      display:
        label: Score calibration ratio
        unit: ratio
        value_format: number
        direction: neutral
      expression:
        op: safe_div
        num:
          op: safe_div
          num: { col: "${positives}" }
          den: { col: "${observations}" }
        den:
          op: safe_div
          num: { col: "${score_sum}" }
          den: { col: "${observations}" }
    method:
      calculation: (positives / observations) / (score_sum / observations)
      accuracy: exact
      algorithm: Ratio of two mergeable sums.
      caveat: 1.0 is perfect calibration; above 1.0 the score under-promises and below 1.0 it over-promises. Read it within score bands — a model can be well calibrated overall while being badly calibrated at every individual score level.
    report:
      chart: kpi_card
      placement: kpi_strip
      kpi: { comparison: previous_period, comparison_period: month }

  - id: model_quality.exploration_rate
    version: 1
    title: Exploration rate
    domain: Model quality
    summary: Share of decisions where the arbitrated score was revised away from the raw model score.
    business_questions:
      - How much traffic is being spent on learning rather than on the best-known action?
      - Is exploration winding down as the models accumulate evidence?
    tags: [ model, exploration, bandit, thompson, learning ]
    maturity: draft
    processor_kinds: [ binary_outcome, numeric_distribution, score_distribution ]
    inputs:
      - role: explored
        label: Explored decision count
        description: A count state carrying a where filter that selects the decisions whose score was revised.
        source: state
        state_types: [ count ]
        preferred_names: [ ExploredUp_Count, Explored_Count ]
        selection: choice
      - role: observations
        label: Total decision count
        source: state
        state_types: [ count ]
        preferred_names: [ Explore_Count, Count ]
        selection: choice
        different_from: explored
    default_metric_id: VS_Exploration_Rate
    metric:
      processor: ${processor_id}
      kind: formula
      description: Explored decisions divided by all scored decisions.
      display:
        label: Exploration rate
        unit: percent
        value_format: percent
        direction: neutral
      expression:
        op: safe_div
        num: { col: "${explored}" }
        den: { col: "${observations}" }
    method:
      calculation: explored / observations
      accuracy: exact
      algorithm: Ratio of two mergeable counts, one of them where-filtered.
      caveat: Exploration is not free and not waste — it is the price of learning. A control or holdout arm whose score is randomised rather than explored will read 100% and should be excluded.
    report:
      chart: kpi_card
      placement: kpi_strip
      kpi: { comparison: previous_period, comparison_period: month }

  - id: model_quality.model_maturity
    version: 1
    title: Model maturity (implied evidence)
    domain: Model quality
    summary: How many responses the adaptive models have implicitly accumulated, recovered from the width of Thompson-sampled exploration.
    business_questions:
      - Which actions are still in cold start, and which have enough evidence to trust?
      - How long does a new action take to converge?
    tags: [ model, maturity, evidence, thompson, bandit, cold-start ]
    maturity: draft
    processor_kinds: [ numeric_distribution, score_distribution ]
    inputs:
      - role: variance_mean
        label: Mean score variance p(1-p)
        description: A pooled mean over a derived column holding score * (1 - score), the Bernoulli variance the posterior is built from.
        source: state
        state_types: [ pooled_mean ]
        preferred_names: [ PropensityVar_Mean, ScoreVar_Mean ]
        selection: field_algorithm
      - role: exploration_sq_mean
        label: Mean squared exploration delta
        description: A pooled mean over a derived column holding the squared difference between the arbitrated and the raw score.
        source: state
        state_types: [ pooled_mean ]
        preferred_names: [ ExplorationSq_Mean ]
        selection: field_algorithm
        different_from: variance_mean
    default_metric_id: VS_Model_Maturity
    metric:
      processor: ${processor_id}
      kind: formula
      description: Implied evidence count behind the adaptive model's score.
      display:
        label: Model maturity (implied responses)
        unit: responses
        value_format: number
        direction: higher_is_better
      expression:
        op: sub
        args:
          - op: safe_div
            num: { col: "${variance_mean}" }
            den: { col: "${exploration_sq_mean}" }
          - lit: 1.0
    method:
      calculation: mean(p*(1-p)) / mean((sampled - p)^2) - 1
      accuracy: statistical
      algorithm: Method-of-moments inversion of a Beta(1 + p*E, 1 + (1-p)*E) posterior, whose variance is approximately p(1-p)/(E+1).
      caveat: An order-of-magnitude pseudo-count, not a posterior count. It assumes the arbitrated score is a Beta draw centred on the model score, so it is meaningless wherever the score is randomised (it correctly collapses to -1 there) or overwritten by other adjustments. Pooled across actions it is dominated by the least mature ones, which makes it a good cold-start alarm but a poor average.
    report:
      chart: kpi_card
      placement: kpi_strip
      kpi: { comparison: previous_period, comparison_period: month }

  - id: model_quality.remaining_uncertainty
    version: 1
    title: Remaining uncertainty
    domain: Model quality
    summary: Share of a score's own variance still being added as exploration noise, on a 0-1 scale.
    business_questions:
      - How far from converged are the adaptive models?
      - How quickly does a newly launched action stop being explored?
    tags: [ model, exploration, uncertainty, convergence, thompson, bandit, cold-start ]
    maturity: draft
    processor_kinds: [ numeric_distribution, score_distribution ]
    inputs:
      - role: exploration_sq_mean
        label: Mean squared exploration delta
        description: A pooled mean over a derived column holding the squared difference between the arbitrated and the raw score.
        source: state
        state_types: [ pooled_mean ]
        preferred_names: [ ExplorationSq_Mean ]
        selection: field_algorithm
      - role: variance_mean
        label: Mean score variance p(1-p)
        description: A pooled mean over a derived column holding score * (1 - score), the Bernoulli variance the posterior is built from.
        source: state
        state_types: [ pooled_mean ]
        preferred_names: [ PropensityVar_Mean, ScoreVar_Mean ]
        selection: field_algorithm
        different_from: exploration_sq_mean
    default_metric_id: VS_Remaining_Uncertainty
    metric:
      processor: ${processor_id}
      kind: formula
      description: Exploration variance as a share of the score's own Bernoulli variance.
      display:
        label: Remaining uncertainty
        unit: ratio
        value_format: percent
        direction: lower_is_better
      expression:
        op: safe_div
        num: { col: "${exploration_sq_mean}" }
        den: { col: "${variance_mean}" }
    method:
      calculation: mean((sampled - p)^2) / mean(p*(1-p)), the reciprocal of (implied evidence + 1)
      accuracy: statistical
      algorithm: Method-of-moments inversion of a Beta(1 + p*E, 1 + (1-p)*E) posterior, expressed as a bounded 0-1 ratio rather than a count.
      caveat: 1.0 means the score is pure exploration and carries no accumulated evidence; values near 0 mean the model has converged. It is the reciprocal of the maturity index plus one, so it is the friendlier axis for a convergence chart. Meaningless wherever the score is randomised rather than explored, where it reads 1.0 or above.
    report:
      chart: kpi_card
      placement: kpi_strip
      kpi: { comparison: previous_period, comparison_period: month }

  - id: funnel.conversion_rate
    version: 1
    title: Funnel conversion rate
    domain: Funnel
    summary: Share of starting-stage entities that reach the selected completion state.
    business_questions:
      - What proportion of the funnel reaches completion?
    tags: [ funnel, conversion, rate ]
    maturity: reviewed
    processor_kinds: [ funnel ]
    inputs:
      - role: start_count
        label: Starting stage
        source: state
        state_types: [ count ]
        preferred_names: [ Impression_Count, Started_Count ]
      - role: completion_count
        label: Completion stage
        source: state
        state_types: [ count ]
        preferred_names: [ Conversion_Count, Completed_Count ]
        different_from: start_count
    default_metric_id: VS_Funnel_Conversion_Rate
    metric:
      processor: ${processor_id}
      kind: formula
      description: Completion-stage count divided by starting-stage count.
      display:
        label: Funnel conversion rate
        unit: percent
        value_format: percent
        direction: higher_is_better
      expression:
        op: safe_div
        num: { col: "${completion_count}" }
        den: { col: "${start_count}" }
    method:
      calculation: completion_count / start_count
      accuracy: exact
      algorithm: Safe division over mergeable funnel count states.
      caveat: Stage definitions and entity-deduplication semantics come from the funnel processor.
    report: { chart: kpi_card, placement: kpi_strip }

  - id: funnel.dropoff_rate
    version: 1
    title: Funnel drop-off rate
    domain: Funnel
    summary: Share lost between a selected starting and ending funnel stage.
    business_questions:
      - Where is the largest loss between two funnel stages?
    tags: [ funnel, dropoff, rate ]
    maturity: reviewed
    processor_kinds: [ funnel ]
    inputs:
      - role: from_state
        label: Starting stage-count state
        source: stage
        preferred_names: [ Impression_Count, Started_Count ]
      - role: to_state
        label: Ending stage-count state
        source: stage
        preferred_names: [ Conversion_Count, Completed_Count ]
        different_from: from_state
    default_metric_id: VS_Funnel_Dropoff
    metric:
      processor: ${processor_id}
      kind: funnel_dropoff
      description: Aggregate funnel drop-off rate between the selected stages.
      display:
        label: Funnel drop-off rate
        unit: percent
        value_format: percent
        direction: lower_is_better
      from_state: ${from_state}
      to_state: ${to_state}
      output: rate
    method:
      calculation: 1 - (to_state / from_state)
      accuracy: exact
      algorithm: Funnel drop-off over persisted stage aggregates.
      caveat: Stage order and entity semantics are defined by the selected processor.
    report: { chart: kpi_card, placement: kpi_strip }

  - id: lifecycle.summary
    version: 1
    title: Lifecycle summary
    domain: Lifecycle
    summary: Aggregate entity lifecycle measures for recurrence, age, and activity.
    business_questions:
      - How active and recurrent are the tracked entities?
    tags: [ entity, lifecycle, recurrence ]
    maturity: reviewed
    processor_kinds: [ entity_lifecycle ]
    inputs:
      - role: holdings_state
        label: Distinct holdings state
        source: state
        state_types: [ count ]
        state_attributes: { distinct: "true" }
        preferred_names: [ unique_holdings ]
      - role: monetary_state
        label: Monetary value state
        source: state
        state_types: [ value_sum ]
        preferred_names: [ lifetime_value ]
      - role: first_purchase_state
        label: First purchase state
        source: state
        state_types: [ min ]
        preferred_names: [ MinPurchasedDate ]
      - role: last_purchase_state
        label: Last purchase state
        source: state
        state_types: [ max ]
        preferred_names: [ MaxPurchasedDate ]
    default_metric_id: VS_Lifecycle_Summary
    metric:
      processor: ${processor_id}
      kind: lifecycle_summary
      description: Lifecycle measures derived from persisted entity lifecycle state.
      display:
        label: Lifecycle summary
        unit: entities
        value_format: number
        direction: neutral
      entity_column: ${entity_column}
      holdings_state: ${holdings_state}
      monetary_state: ${monetary_state}
      first_purchase_state: ${first_purchase_state}
      last_purchase_state: ${last_purchase_state}
    method:
      calculation: lifecycle outputs defined by the entity lifecycle metric implementation
      accuracy: exact
      algorithm: Mergeable entity lifecycle aggregates.
      caveat: This metric returns multiple outputs and is usually better suited to a table than a KPI card.
    report: { chart: table, placement: content }

  - id: category.top_items
    version: 1
    title: Top categories
    domain: Category
    summary: Most frequent items from a persisted heavy-hitters sketch.
    business_questions:
      - Which categories contribute the most volume?
      - Which high-frequency items deserve attention?
    tags: [ category, topk, frequent-items, sketch ]
    maturity: reviewed
    processor_kinds:
      [ binary_outcome, numeric_distribution, score_distribution, entity_lifecycle, entity_set, funnel, snapshot ]
    inputs:
      - role: topk_state
        label: Category field
        source: state
        state_types: [ topk ]
        selection: field_algorithm
    default_metric_id: VS_Top_Categories
    metric:
      processor: ${processor_id}
      kind: topk_items
      description: Top categories estimated from a persisted frequent-items sketch.
      display:
        label: Top categories
        unit: observations
        value_format: integer
        direction: neutral
      state: ${topk_state}
      limit: 10
      error_type: NO_FALSE_POSITIVES
    method:
      calculation: ten most frequent items with estimated frequencies
      accuracy: approximate
      algorithm: Apache DataSketches frequent-items sketch.
      caveat: Error guarantees depend on the configured mode and sketch capacity.
    report: { chart: table, placement: content }
