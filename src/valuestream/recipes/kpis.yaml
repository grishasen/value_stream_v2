  - id: experiments.test_control_comparison
    version: 1
    title: Test/control effect and lift
    domain: Business experiments
    summary: Compare Test and Control response rates, absolute percentage-point difference, relative lift and a 95%
      confidence interval.
    business_questions:
    - Compare Test and Control response rates, absolute percentage-point difference, relative lift and a 95% confidence
      interval.
    tags:
    - business experiments
    - experiments
    - test_control_comparison
    maturity: reviewed
    processor_kinds:
    - binary_outcome
    inputs:
    - role: variant
      label: Test/control or experiment grouping
      source: dimension
      preferred_names:
      - ExperimentGroup
      - ModelControlGroup
      - DefaultBannerControlGroup
    default_metric_id: VS_TestControlComparison
    metric:
      processor: ${processor_id}
      kind: variant_compare
      variant_column: ${variant}
      test_role: Test
      control_role: Control
      confidence_level: 0.95
      outputs:
      - TestCTR
      - ControlCTR
      - TestSampleSize
      - ControlSampleSize
      - AbsoluteRateDifference
      - AbsoluteRateDifference_CI_Low
      - AbsoluteRateDifference_CI_High
      - Lift
      - Lift_P_Val
      description: Compare Test and Control response rates, absolute percentage-point difference, relative lift and
        a 95% confidence interval.
      display:
        label: Test/control effect and lift
        unit: percent
        value_format: percent
        direction: neutral
    method:
      calculation: TestCTR - ControlCTR; TestCTR / ControlCTR - 1; 95% interval
      accuracy: statistical
      algorithm: Existing aggregate statistical or sketch implementation.
      caveat: Compare the same outcome definition and business population. Group by or filter to one ExperimentName
        so unrelated experiments are not pooled. Test and Control identify arms; other labels are excluded by two-arm
        tests. A causal interpretation requires valid random assignment and comparable exposure. Relative lift requires
        a non-zero control rate. Read sample sizes and interval alongside the effect.
    report:
      chart: table
      placement: content
    required_states:
      Positives: count
      Negatives: count
  - id: experiments.z_test
    version: 1
    title: 'Z-test: Test versus Control'
    domain: Business experiments
    summary: Assess whether two experiment response rates differ using a two-sided two-proportion z-test. For example,
      compare 400 clicks from 10,000 Test outcomes with 300 from 10,000 Control outcomes.
    business_questions:
    - Assess whether two experiment response rates differ using a two-sided two-proportion z-test.
    tags:
    - business experiments
    - experiments
    - z_test
    maturity: reviewed
    processor_kinds:
    - binary_outcome
    inputs:
    - role: variant
      label: Test/control or experiment grouping
      source: dimension
      preferred_names:
      - ExperimentGroup
      - ModelControlGroup
      - DefaultBannerControlGroup
    default_metric_id: VS_ZTest
    metric:
      processor: ${processor_id}
      kind: proportion_test
      variant_column: ${variant}
      test_role: Test
      control_role: Control
      outputs:
      - Count
      - Positives
      - Negatives
      - z_score
      - z_p_val
      description: Assess whether two experiment response rates differ using a two-sided two-proportion z-test.
      display:
        label: 'Z-test: Test versus Control'
        unit: probability
        value_format: number
        direction: neutral
    method:
      calculation: two-proportion z statistic and two-sided p-value
      accuracy: statistical
      algorithm: Existing aggregate statistical or sketch implementation.
      caveat: Compare the same outcome definition and business population. Group by or filter to one ExperimentName
        so unrelated experiments are not pooled. Test and Control identify arms; other labels are excluded by two-arm
        tests. A causal interpretation requires valid random assignment and comparable exposure. A p-value is not
        the probability that Test is better. Check sample adequacy, effect size and multiple-testing policy.
    report:
      chart: table
      placement: content
    required_states:
      Positives: count
      Negatives: count
  - id: experiments.chi_square_test
    version: 1
    title: Chi-square test across experiment variants
    domain: Business experiments
    summary: Assess whether response rates differ across all recorded experiment variants.
    business_questions:
